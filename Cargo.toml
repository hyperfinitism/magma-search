[workspace]
members = ["magma-core", "magma-iso", "magma-sat"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
libc = "0.2.190"
rustsat = { version = "0.7.5", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
